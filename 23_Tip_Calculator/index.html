<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Split the bill</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading"><h1>Split the Bill</h1></header>
            <div class="split">
                <div class="controls-panel">
                    <form id="form">
                        <label for="bill">Bill amount</label>
                        <input
                            id="bill"
                            max="1000000000"
                            min="0.01"
                            placeholder="80.00"
                            required=""
                            step="0.01"
                            type="number"
                        />
                        <div class="fields">
                            <div>
                                <label for="tip">Tip (%)</label>
                                <input
                                    id="tip"
                                    max="100"
                                    min="0"
                                    required=""
                                    step="0.1"
                                    type="number"
                                    value="10"
                                />
                            </div>
                            <div>
                                <label for="people">People</label>
                                <input
                                    id="people"
                                    max="1000"
                                    min="1"
                                    required=""
                                    type="number"
                                    value="2"
                                />
                            </div>
                        </div>
                        <div class="row"><button>Calculate</button></div>
                    </form>
                </div>
                <div class="result-panel">
                    <h2>Bill summary</h2>
                    <output aria-live="polite" class="result" id="result">
                        Enter the bill to get started.
                    </output>
                    <p class="muted">Amounts use the same currency as your bill.</p>
                </div>
            </div>
        </main>
    </body>
</html>
