<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Web basics quiz</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading">
                <h1>Web Basics Quiz</h1>
                <p class="muted" id="progress"></p>
            </header>

            <h2 id="question"></h2>
            <div id="answers"></div>
            <p class="status" id="feedback" role="status"></p>
            <button disabled="" id="next">Next question</button>
            <button class="secondary" hidden="" id="restart">Try again</button>
        </main>
    </body>
</html>
