<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Kitchen timer</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading"><h1>Kitchen Timer</h1></header>
            <div class="split">
                <div class="controls-panel">
                    <div class="fields">
                        <div>
                            <label for="minutes">Minutes</label>
                            <input id="minutes" max="999" min="0" type="number" value="5" />
                        </div>
                        <div>
                            <label for="seconds">Seconds</label>
                            <input id="seconds" max="59" min="0" type="number" value="0" />
                        </div>
                    </div>
                    <div class="row">
                        <button id="start">Start</button>
                        <button class="secondary" id="reset">Reset</button>
                    </div>
                    <p class="status" id="status" role="status">Set a time and press start.</p>
                </div>
                <div class="result-panel">
                    <h2>Time remaining</h2>
                    <div class="big" id="time" role="timer">05:00</div>
                </div>
            </div>
        </main>
    </body>
</html>
