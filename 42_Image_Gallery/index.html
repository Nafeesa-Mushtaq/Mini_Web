<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Little landscapes</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading">
                <p class="muted">LITTLE LANDSCAPES</p>
                <h1>Somewhere Quiet</h1>
            </header>

            <figure>
                <img
                    alt="Layered blue mountains beneath a pale sun"
                    id="image"
                    src="mountains.svg"
                />
                <figcaption id="caption">Blue mountains</figcaption>
            </figure>
            <div class="controls">
                <button aria-label="Previous image" id="previous">← Previous</button>
                <span id="position" role="status">1 / 4</span>
                <button aria-label="Next image" id="next">Next →</button>
            </div>
        </main>
    </body>
</html>
