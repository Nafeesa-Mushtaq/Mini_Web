<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Length converter</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading"><h1>Length Converter</h1></header>
            <div class="split">
                <div class="controls-panel">
                    <form id="form">
                        <label for="value">Length</label>
                        <input
                            id="value"
                            max="1000000000"
                            min="0"
                            required=""
                            step="any"
                            type="number"
                            value="1"
                        />
                        <div class="fields">
                            <div>
                                <label for="from">From</label>
                                <select id="from">
                                    <option value="1">Meters</option>
                                    <option value="1000">Kilometers</option>
                                    <option value="0.3048">Feet</option>
                                    <option value="0.0254">Inches</option>
                                    <option value="1609.344">Miles</option>
                                </select>
                            </div>
                            <div>
                                <label for="to">To</label>
                                <select id="to">
                                    <option value="1">Meters</option>
                                    <option value="1000">Kilometers</option>
                                    <option selected="" value="0.3048">Feet</option>
                                    <option value="0.0254">Inches</option>
                                    <option value="1609.344">Miles</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <button>Convert</button>
                            <button class="secondary" id="swap" type="button">Swap units</button>
                        </div>
                    </form>
                </div>
                <div class="result-panel">
                    <h2>Result</h2>
                    <output aria-live="polite" class="result" id="result"></output>
                </div>
            </div>
        </main>
    </body>
</html>
