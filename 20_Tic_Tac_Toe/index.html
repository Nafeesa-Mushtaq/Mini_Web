<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Tic-tac-toe</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading">
                <h1>Tic-Tac-Toe</h1>
                <p class="muted">Two players, one screen.</p>
            </header>
            <div class="split">
                <div class="controls-panel">
                    <p id="status" role="status">X goes first.</p>
                    <button id="restart">New round</button>
                </div>
                <div class="board-panel"><div aria-label="Tic-tac-toe board" id="board"></div></div>
            </div>
        </main>
    </body>
</html>
