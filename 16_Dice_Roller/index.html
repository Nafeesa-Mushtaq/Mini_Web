<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Roll the dice</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading">
                <h1>Roll the Dice</h1>
                <p class="muted">Two dice. A little luck.</p>
            </header>

            <div class="dice">
                <span aria-label="First die: 1" id="first">⚀</span>
                <span aria-label="Second die: 1" id="second">⚀</span>
            </div>
            <p id="total" role="status">Total: 2</p>
            <button id="roll">Roll again</button>
        </main>
    </body>
</html>
