<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Decimal to binary</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading">
                <p class="muted">BASE 10 → BASE 2</p>
                <h1>Decimal to Binary</h1>
            </header>
            <div class="split">
                <div class="controls-panel">
                    <form id="form">
                        <label for="decimal">Whole number</label>
                        <input
                            id="decimal"
                            max="4294967295"
                            min="0"
                            required=""
                            step="1"
                            type="number"
                            value="42"
                        />
                        <div class="row"><button>Convert</button></div>
                    </form>
                </div>
                <div class="result-panel">
                    <h2>Result</h2>
                    <output aria-live="polite" class="result" id="binary">101010</output>
                    <p class="muted">Accepts numbers from 0 to 4,294,967,295.</p>
                </div>
            </div>
        </main>
    </body>
</html>
