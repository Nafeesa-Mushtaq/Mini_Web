<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Click counter</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading">
                <h1>Click Counter</h1>
                <p class="muted">Keep count of the little things.</p>
            </header>

            <output aria-live="polite" class="big" id="count">0</output>
            <div class="row">
                <button aria-label="Subtract one" id="minus">−</button>
                <button class="secondary" id="reset">Reset</button>
                <button aria-label="Add one" id="plus">+</button>
            </div>
        </main>
    </body>
</html>
