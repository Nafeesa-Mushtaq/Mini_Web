<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Quick note</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading"><h1>Quick Note</h1></header>

            <label for="note">Something to remember</label>
            <textarea id="note" placeholder="Write it down…" rows="9"></textarea>
            <div class="row">
                <button class="secondary" id="clear">Clear note</button>
                <button class="secondary" hidden="" id="undo">Undo clear</button>
            </div>
            <p class="status" id="status" role="status">Your note stays in this browser.</p>
        </main>
    </body>
</html>
