<!doctype html>

<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Memory match</title>
        <link href="style.css" rel="stylesheet" />
        <script defer="" src="script.js"></script>
    </head>
    <body>
        <main>
            <header class="project-heading"><h1>Memory Match</h1></header>
            <div class="split">
                <div class="controls-panel">
                    <p id="status" role="status">Find the six matching pairs.</p>
                    <div class="row">
                        <button id="restart">Shuffle again</button>
                        <span id="moves">Moves: 0</span>
                    </div>
                </div>
                <div class="cards-panel"><div aria-label="Memory cards" id="cards"></div></div>
            </div>
        </main>
    </body>
</html>
